name = "blackbarnlabs"
compatibility_date = "2026-08-20"
main = "src/worker.js"

# wrangler deploy (Cloudflare's current build) needs an assets
# directory. This is a static site at the repo root.
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Notify-me signups (POST /api/notify). Schema: migrations/.
# Must live here: git-driven deploys drop dashboard-only bindings.
[[d1_databases]]
binding = "NOTIFY_DB"
database_name = "blackbarnlabs-notify"
database_id = "db61698f-cff5-4e01-ae1c-0fa40bca51f1"
migrations_dir = "migrations"
