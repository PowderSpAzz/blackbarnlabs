name = "blackbarnlabs"
compatibility_date = "2026-08-20"
main = "src/worker.js"

# wrangler deploy (Cloudflare's current build) needs an assets
# directory. This is a static site at the repo root.
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]
