name = "blackbarnlabs"
compatibility_date = "2026-08-20"
main = "src/worker.js"

# wrangler deploy (Cloudflare's current build) needs an assets
# directory. This is a static site at the repo root.
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
